# 1 MiB profile: the kernel and its tables fit in RAMCAP MiB of RAM (see include/kernel.h).
# Build and run:  make ENV=tiny run
ARCH=aarch64
DEVICE=qemu
FS=ext4
SIZE=2M
MBR=
PROFILE=tiny
MAXRAM=4
MEM=4                 # QEMU needs >= 4 MiB to place its device tree (see README)
RAMCAP=1             # the kernel uses 1 MiB
LOAD_ADDR=0x40010000
PERSIST_KB=128
